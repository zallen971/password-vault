<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <title>Vault</title>
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme-boot.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="splash"><img src="icons/logo.svg" alt="" width="56" height="56" /></div>
    </div>
    <noscript>
      <div class="auth">
        <div class="auth-card message-card">
          <h1 class="auth-title">JavaScript is required</h1>
          <p>Vault encrypts and decrypts everything in your browser, so it cannot work with JavaScript turned off.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
